<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reading Shelf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
    <rect x="8" y="30" width="34" height="8" rx="1" fill="#8b5e3c"/>
    <rect x="10" y="20" width="14" height="10" fill="#3b82f6"/>
    <rect x="26" y="16" width="14" height="14" fill="#22c55e"/>
    <rect x="12" y="10" width="10" height="10" transform="rotate(-8 17 15)" fill="#ef4444"/>
    </svg>
    <h1>My Reading Shelf</h1>
    <p id="streak-label">🔥 Streak: 0 days</p>
  </header>

    <div class="book-adder">
  <button id="show-add-form-btn">+ Add Book</button>

  <div id="add-form" class="add-form">
    <input type="text" id="book-title" placeholder="Book title...">
    <input type="text" id="book-author" placeholder="Author...">
    <input type="number" id="book-current-page" placeholder="Current page" value="0">
    <input type="number" id="book-total-pages" placeholder="Total pages">
    <label>
      <input type="checkbox" id="book-done">
      Finished?
    </label>
    <button id="add-book-btn">Confirm</button>
  </div>
</div>

<div class="selected-book-controls">
  <input type="number" id="update-page-input" placeholder="Current page">
  <button id="update-page-btn">Update Page</button>
  <button id="change-book-status">Done</button>
  <button id="remove-book">Remove</button>
</div>

  <div id="shelf" class="shelf"></div>

<div class="selected-book-info">
  <p id="selected-book-label">No book selected</p>
  <p id="selected-book-current-page"></p>
  <div class="progress-bar-track">
    <div id="progress-bar-fill" class="progress-bar-fill"></div>
  </div>
  <button id="show-notes-btn">Notes</button>
</div>

<div id="notes-panel" class="notes-panel">
  <h3 id="notes-panel-title">Notes</h3>
  <textarea id="book-notes-input" placeholder="Write your thoughts on this book..."></textarea>
  <button id="save-notes-btn">Save Notes</button>
</div>

  <script src="script.js"></script>
</body>
</html>
